default_permissions = "portfolio"
project_doc_max_bytes = 32768

[features]
hooks = true

[features.network_proxy]
enabled = true

[features.network_proxy.unix_sockets]
"/run/user/1000/docker.sock" = "allow"

[permissions.portfolio]
description = "Workspace do portfólio com segredos bloqueados e artefatos gerados somente leitura."
extends = ":workspace"

[permissions.portfolio.filesystem.":workspace_roots"]
".git" = "write"
"**/.env" = "deny"
"**/.env.local" = "deny"
"**/.env.*.local" = "deny"
"node_modules/**" = "read"
"studio/node_modules/**" = "read"
"build/**" = "read"
"studio/dist/**" = "read"
"studio/.sanity/**" = "read"

[permissions.portfolio.network]
enabled = true

[permissions.portfolio.network.unix_sockets]
"/run/user/1000/docker.sock" = "allow"
